name: Build Capsule Manager

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Installers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/capsule-manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/capsule-manager/package-lock.json

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux installers
        run: npm run build -- --linux deb rpm AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsule-manager-linux
          path: |
            app/capsule-manager/dist/*.AppImage
            app/capsule-manager/dist/*.deb
            app/capsule-manager/dist/*.rpm
          if-no-files-found: error

  build-windows:
    name: Build Windows NSIS
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/capsule-manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/capsule-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run build -- --win nsis

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsule-manager-windows
          path: app/capsule-manager/dist/*.exe
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: capsule-manager-${{ github.run_number }}
          name: Capsule Manager ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
